name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build
        run: |
          python -m compileall -q .agents/skills/hearmark/scripts
          python -m unittest discover -s tests -q
          node --check site/app.js
          python scripts/build.py
          python scripts/check_package.py
      - name: Install Skill on supported systems
        if: runner.os != 'Linux'
        run: |
          python .agents/skills/hearmark/scripts/install.py --agent-skills-dir "~/.hearmark-test-agent/skills"
          python .agents/skills/hearmark/scripts/install.py --skip-deps --agent-skills-dir "~/.hearmark-test-agent/skills"
          python -c "from pathlib import Path; home=Path.home(); assert (home/'.hearmark-test-agent/skills/hearmark').resolve() == (home/'.agents/skills/hearmark').resolve()"
