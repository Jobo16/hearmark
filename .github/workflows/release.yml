name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build.py
          python3 - <<'PY'
          import json, os, pathlib
          version = json.loads(pathlib.Path('dist/manifest.json').read_text())['version']
          assert os.environ['TAG'] == 'v' + version
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hearmark-package.zip dist/manifest.json --title "Hearmark $GITHUB_REF_NAME" --generate-notes
