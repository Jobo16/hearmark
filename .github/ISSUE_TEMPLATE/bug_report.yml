name: Bug report
description: Report a reproducible Hearmark failure without sharing private media or cookies
body:
  - type: input
    id: version
    attributes:
      label: Hearmark version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and CPU
      placeholder: macOS 15, M2 or Windows 11, x64
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error kind
      description: Remove cookies, tokens, private URLs, and personal recordings.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use public or synthetic media if possible.
